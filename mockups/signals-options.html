<!doctype html>
<!-- Three design options for the signal results section (?v=1, 2, 3). Copy into website/ and open over HTTP to view; not part of the site. -->
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body { padding: 36px 0 48px; }
.k { color: var(--gold-mid); font: 600 .78rem var(--font-head); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 10px; }
.goldtxt { background: var(--metal-gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card2 { border-radius: 20px; border: 1px solid var(--line); background: var(--metal-red); box-shadow: var(--metal-edge); padding: 20px 22px; }
.medal { display: inline-grid; vertical-align: middle; }
.hype { font: 800 .7rem var(--font-head); padding: 2px 6px; border-radius: 6px; color: #fff; background: linear-gradient(135deg, #ff4fd8, #e52150 60%, #ff9a3d); }
.goldbar { background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 45%, rgba(0,0,0,.15)), linear-gradient(100deg, #8f6a1c, #d2ab42 18%, #f6e4a6 34%, #e6c76e 48%, #b38b2d 66%, #f0d68c 84%, #8f6a1c);
  border: 1px solid rgba(120,82,10,.7); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 12px rgba(0,0,0,.35); }

/* ============ A: Vault + week ladder ============ */
.A-rooms { display: flex; gap: 8px; margin-bottom: 14px; }
.A-room { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .9rem; color: var(--muted); }
.A-room.on { color: var(--text); border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
.A-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding: 34px 36px; border-radius: 26px;
  background: radial-gradient(60% 120% at 20% 0%, rgba(var(--crimson-rgb), .7), transparent 70%), radial-gradient(40% 80% at 90% 100%, rgba(220,184,74,.15), transparent 70%), var(--surface); border: 1px solid rgba(var(--accent-2-rgb), .35); }
.A-hero h3 { margin: 0; font-size: 1.1rem; color: var(--muted); font-weight: 500; }
.A-big { font: 700 clamp(3rem, 8vw, 5.6rem) var(--font-head); line-height: 1; margin: 6px 0 4px; }
.A-hero p { margin: 0; color: var(--muted); }
.A-chips { display: grid; gap: 10px; }
.A-chip { padding: 12px 18px; border-radius: 16px; background: rgba(0,0,0,.35); border: 1px solid var(--line); min-width: 190px; }
.A-chip b { display: block; font: 600 1.5rem var(--font-head); }
.A-chip span { font-size: .78rem; color: var(--muted); }
.A-ladder { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; margin-top: 16px; }
.A-mon { grid-column: span 1; display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.A-mon b { font: 600 .95rem var(--font-head); }
.A-mon span { color: var(--accent-hi); font-weight: 600; font-size: .9rem; }
.A-wk { display: grid; grid-template-columns: 124px 1fr 64px; white-space: nowrap; align-items: center; gap: 10px; font-size: .78rem; color: var(--muted); }
.A-bar { position: relative; height: 16px; border-radius: 6px; }
.A-bar i { position: absolute; top: -3px; width: 3px; height: 22px; border-radius: 2px; background: #ff3b52; box-shadow: 0 0 6px rgba(255,59,82,.8); }
.A-wk em { font-style: normal; text-align: right; color: var(--text); font-weight: 600; }
.A-col { display: grid; gap: 6px; align-content: start; }

/* ============ B: Ticker board + month cards ============ */
.B-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.B-tab { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #0d0b0c; font: 600 .82rem var(--font); letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.B-tab b { font-family: var(--font-head); }
.B-tab.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 1px rgba(var(--accent-rgb), .3), 0 0 26px rgba(var(--accent-rgb), .12); }
.B-tab .up { font-feature-settings: "tnum" 1; }
.B-tape { margin: 14px 0; overflow: hidden; white-space: nowrap; border-block: 1px solid rgba(var(--accent-2-rgb), .3); padding: 9px 0; font: 600 .82rem var(--font); color: var(--muted); background: linear-gradient(90deg, rgba(var(--crimson-rgb), .35), transparent 30%, transparent 70%, rgba(var(--crimson-rgb), .35)); }
.B-tape span { margin-right: 26px; } .B-tape b { color: var(--accent-hi); } .B-tape i { font-style: normal; color: #ff5a6b; }
.B-board { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.B-flap { display: flex; gap: 6px; margin: 6px 0 10px; }
.B-flap span { position: relative; display: grid; place-items: center; width: 54px; height: 74px; border-radius: 10px; font: 700 2.6rem var(--font-head); background: linear-gradient(180deg, #1d1a1b 50%, #141112 50%); border: 1px solid #2c2526; color: #f0d68c; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px rgba(0,0,0,.4); }
.B-flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.7); }
.B-flap span.sep { width: 20px; background: none; border: 0; box-shadow: none; color: var(--muted); font-size: 2rem; }
.B-flap span.sep::after { display: none; }
.B-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.B-mini div { padding: 14px; border-radius: 14px; background: #0d0b0c; border: 1px solid var(--line); }
.B-mini b { display: block; font: 600 1.5rem var(--font-head); color: var(--text); }
.B-mini span { font-size: .76rem; color: var(--muted); }
.B-months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.B-m { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--metal-red); }
.B-m header { display: flex; justify-content: space-between; align-items: baseline; }
.B-m header b { font: 600 1rem var(--font-head); }
.B-m header span { font: 600 1.25rem var(--font-head); }
.B-m svg { display: block; width: 100%; height: 52px; margin: 8px 0; }
.B-m footer { display: flex; gap: 8px; font-size: .74rem; color: var(--muted); }
.B-m footer span { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.B-m footer .sl { color: #ff6b7b; border-color: rgba(255,59,82,.35); }

/* ============ C: Editorial + gold pillars like the logo ============ */
.C { display: grid; grid-template-columns: 1fr 1.25fr; gap: 26px; align-items: center; }
.C-rooms { display: grid; gap: 4px; margin-bottom: 22px; }
.C-room { display: flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--muted); padding: 6px 0; }
.C-room.on { color: var(--text); font-weight: 600; }
.C-room.on::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
.C-big { font: 700 clamp(3rem, 7vw, 5rem) var(--font-head); line-height: .95; }
.C-unit { font: 600 1.2rem var(--font-head); color: var(--muted); margin-left: 6px; }
.C-lede { font-size: 1.12rem; line-height: 1.7; color: var(--text); max-width: 34ch; margin: 14px 0 18px; }
.C-lede b { color: var(--accent-hi); }
.C-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }
.C-facts div { padding: 14px 8px 0 0; }
.C-facts b { display: block; font: 600 1.5rem var(--font-head); }
.C-facts span { font-size: .76rem; color: var(--muted); }
.C-chart { position: relative; padding: 22px 18px 10px; border-radius: 26px; background: radial-gradient(70% 80% at 50% 100%, rgba(var(--crimson-rgb), .55), transparent 70%), var(--surface); border: 1px solid rgba(var(--accent-2-rgb), .3); }
.C-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.C-beads { margin-top: 22px; }
.C-beadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.C-bead { border-radius: 50%; display: grid; place-items: center; position: relative; }
.C-bead.sl { box-shadow: 0 0 0 2px #0b0a0b, 0 0 0 4px #ff3b52; }
.C-cap { margin-top: 10px; font-size: .78rem; color: var(--muted); display: flex; gap: 18px; }
.C-cap i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.lot { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 18px; }
.lot .chips { display: flex; gap: 6px; } .lot .chips span { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.lot .chips span.on { color: #1a1209; background: var(--metal-gold); border-color: transparent; }
.lot b { font: 600 1.9rem var(--font-head); }
.note { font-size: .76rem; color: var(--muted); margin-top: 14px; }
</style></head>
<body><div class="wrap" id="root"></div>
<script src="js/config.js"></script>
<script src="js/signals-data.js"></script>
<script>
const v = new URLSearchParams(location.search).get("v") || "1";
const D = window.OTM_SIGNALS, r = D.rooms[0], ds = r.days;
const n = (x, d = 0) => Number(x).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const sg = (x, d = 0) => (x > 0 ? "+" : x < 0 ? "−" : "") + n(Math.abs(x), d);
const mon = (iso) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const won = ds.reduce((s, d) => s + d[1], 0), lost = ds.reduce((s, d) => s + d[2], 0), net = won - lost, sls = ds.reduce((s, d) => s + d[3], 0);
const W = new Map(); ds.forEach((d) => { const k = mon(d[0]), g = W.get(k) || { k, net: 0, sl: 0 }; g.net += d[1] - d[2]; g.sl += d[3]; W.set(k, g); });
const weeks = [...W.values()], maxW = Math.max(...weeks.map((w) => w.net));
const M = new Map(); ds.forEach((d) => { const m = d[0].slice(0, 7), g = M.get(m) || { m, net: 0, sl: 0, days: [] }; g.net += d[1] - d[2]; g.sl += d[3]; g.days.push(d[1] - d[2]); M.set(m, g); });
const months = [...M.values()], maxM = Math.max(...months.map((x) => x.net));
const mS = (m) => new Date(m + "-15T12:00:00").toLocaleDateString("th-TH", { month: "short" });
const mL = (m) => new Date(m + "-15T12:00:00").toLocaleDateString("th-TH", { month: "long" });
const dS = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short" });
const usd01 = net * 10 * 0.1 * 0.85;
function medal(k, size = 30) {
  if (k === "hype") return '<span class="hype">HYPE</span>';
  const p = { 1: ["#6e4f12", "#c89f3a", "#f6e4a6"], 2: ["#5c6069", "#b4b8c1", "#eef0f4"], 3: ["#5a2e14", "#b06a3b", "#f0b38a"] }[k];
  return `<svg class="medal" viewBox="0 0 40 46" width="${size}" height="${size * 1.15}"><defs><radialGradient id="m${k}${size}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${p[2]}"/><stop offset=".6" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[0]}"/></radialGradient></defs><path d="M12 0h7l-3 14h-7zM28 0h-7l3 14h7z" fill="#e52150"/><circle cx="20" cy="28" r="15" fill="url(#m${k}${size})" stroke="${p[0]}"/><text x="20" y="33" text-anchor="middle" fill="#2a1a08" style="font:700 14px var(--font-head)">${k}</text></svg>`;
}
const rooms = [[1, "Swing Elite"], [2, "Scalping Pro ⚡"], [3, "RR High Reward"], ["hype", "BTCUSD / NAS100"]];
const title = `<p class="kicker wide-caps">ผลงานสัญญาณ</p><h2 style="font-size:clamp(1.7rem,4vw,2.6rem);margin:0 0 22px">ผลงานจริงของห้องสัญญาณแต่ละห้อง</h2>`;
const lot = `<div class="card2 lot"><div><p class="k">ถ้าเทรดตามทุกสัญญาณ</p><div class="chips"><span>0.01</span><span class="on">0.1</span><span>0.5</span><span>1.0 lot</span></div></div><div style="text-align:right"><b class="goldtxt">+$${n(usd01)}</b><div style="font-size:.8rem;color:var(--muted)">ที่ 0.1 lot หลังหักสเปรด/คอม 15%</div></div></div>`;
const note = `<p class="note">รวมจากสรุปผลประจำสัปดาห์ที่ประกาศในห้อง ผลในอดีตไม่ได้รับประกันผลในอนาคต</p>`;
let html = "";

if (v === "1") {
  const byM = new Map(); weeks.forEach((w) => { const m = w.k.slice(0, 7); if (!byM.has(m)) byM.set(m, []); byM.get(m).push(w); });
  const blocks = [...byM.entries()].map(([m, ws]) => `<div class="A-col"><div class="A-mon"><b>${mL(m)}</b><span>${sg(ws.reduce((s, w) => s + w.net, 0))}</span></div>${ws.map((w) => {
    const fri = new Date(w.k + "T12:00:00Z"); fri.setUTCDate(fri.getUTCDate() + 4);
    const pct = (w.net / maxW) * 100;
    return `<div class="A-wk"><span>${dS(w.k)}–${dS(fri.toISOString().slice(0, 10))}</span><div class="A-bar goldbar" style="width:${pct.toFixed(1)}%">${Array.from({ length: w.sl }, (_, i) => `<i style="left:${18 + i * 8}%"></i>`).join("")}</div><em>${sg(w.net / 1000, 1)}k</em></div>`; }).join("")}</div>`);
  const half = Math.ceil(blocks.length / 2);
  html = `${title}
  <div class="A-rooms">${rooms.map(([k, nm], i) => `<span class="A-room ${i ? "" : "on"}">${medal(k, 24)}${nm}</span>`).join("")}</div>
  <div class="A-hero"><div>${medal(1, 44)}<h3 style="display:inline-block;margin-left:10px">Swing Elite · ทองคำ (XAUUSD) · 9 มี.ค. – 6 พ.ย. 2026</h3>
    <div class="A-big goldtxt">${sg(net)}</div><p>pips สุทธิ จาก 35 สัปดาห์ · เฉลี่ย ${sg(net / weeks.length)} ต่อสัปดาห์</p></div>
    <div class="A-chips"><div class="A-chip"><b class="up">170/170</b><span>วันที่กำไร</span></div><div class="A-chip"><b>24 <small style="font-size:.9rem;color:var(--muted)">ครั้ง · ${sg(-lost)}</small></b><span>ติด SL</span></div><div class="A-chip"><b class="goldtxt">${n(won / lost, 1)}</b><span>Profit factor</span></div></div></div>
  <div class="A-ladder"><div class="A-col">${blocks.slice(0, half).join("")}</div><div class="A-col">${blocks.slice(half).join("")}</div></div>
  <p class="note" style="margin-top:8px"><span style="display:inline-block;width:3px;height:12px;background:#ff3b52;margin-right:6px;vertical-align:-2px"></span>ขีดแดงบนแท่ง = ติด SL 1 ครั้ง · แท่งยาว = สัปดาห์ที่ได้มาก</p>
  ${lot}${note}`;
}

if (v === "2") {
  const digits = n(net).split("").map((c) => `<span class="${c === "," ? "sep" : ""}">${c}</span>`).join("");
  const tape = weeks.slice(-12).map((w) => `<span>${dS(w.k)} <b>${sg(w.net)}</b>${w.sl ? ` <i>SL×${w.sl}</i>` : ""}</span>`).join("");
  const spark = (arr) => { let c = 0; const p = arr.map((x) => (c += x)); const mx = Math.max(...p); return `<svg viewBox="0 0 200 52" preserveAspectRatio="none"><defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcb84a" stop-opacity=".45"/><stop offset="1" stop-color="#dcb84a" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 52 ${p.map((y, i) => `L${(i / (p.length - 1)) * 200} ${50 - (y / mx) * 46}`).join(" ")} L200 52Z" fill="url(#sp)"/><path d="${p.map((y, i) => `${i ? "L" : "M"}${(i / (p.length - 1)) * 200} ${50 - (y / mx) * 46}`).join(" ")}" fill="none" stroke="#f0d68c" stroke-width="2"/></svg>`; };
  html = `${title}
  <div class="B-tabs">${rooms.map(([k, nm], i) => `<div class="B-tab ${i ? "" : "on"}"><span>${medal(k, 20)} ${nm.toUpperCase()}</span>${i ? '<span style="font-size:.7rem">เร็ว ๆ นี้</span>' : `<b class="up">+261.8k</b>`}</div>`).join("")}</div>
  <div class="B-tape">${tape}${tape}</div>
  <div class="B-board"><div class="card2"><p class="k">Swing Elite · pips สุทธิ · 9 มี.ค. – 6 พ.ย. 2026</p><div class="B-flap"><span class="sep">+</span>${digits}</div>
    <p style="margin:0;color:var(--muted)">ได้ <b class="up">${sg(won)}</b> · เสีย <b class="down">${sg(-lost)}</b> · จากสรุปประจำสัปดาห์ 35 สัปดาห์</p></div>
    <div class="B-mini"><div><b class="up">100%</b><span>วันที่กำไร (170/170)</span></div><div><b>24</b><span>ติด SL</span></div><div><b class="goldtxt">${n(won / lost, 1)}</b><span>Profit factor</span></div><div><b>${sg(net / weeks.length)}</b><span>เฉลี่ยต่อสัปดาห์</span></div></div></div>
  <div class="B-months">${months.map((g) => `<div class="B-m"><header><b>${mL(g.m)}</b><span class="goldtxt">${sg(g.net)}</span></header>${spark(g.days)}<footer><span>${g.days.length} วันเทรด</span><span class="${g.sl ? "sl" : ""}">SL ${g.sl}</span></footer></div>`).join("")}</div>
  ${lot}${note}`;
}

if (v === "3") {
  // pillars like the logo's bars, a red arrow riding over them, a gold crescent behind
  const Wd = 560, Hd = 330, base = 290, bw = 42, gap = (Wd - 40 - months.length * bw) / (months.length - 1);
  const xs = months.map((_, i) => 20 + i * (bw + gap)), hs = months.map((g) => (g.net / maxM) * 230);
  const pillars = months.map((g, i) => `<rect x="${xs[i]}" y="${base - hs[i]}" width="${bw}" height="${hs[i]}" rx="4" fill="url(#pg)" stroke="#78520a" stroke-opacity=".7"/>
    <rect x="${xs[i] + 3}" y="${base - hs[i] + 3}" width="${bw - 6}" height="7" rx="3" fill="#fff" opacity=".35"/>
    
    <text x="${xs[i] + bw / 2}" y="${base + 20}" text-anchor="middle" style="font:500 12px var(--font);fill:var(--muted)">${mS(g.m)}</text>
    ${g.sl ? `<text x="${xs[i] + bw / 2}" y="${base - 10}" text-anchor="middle" style="font:700 10px var(--font);fill:#7a1020">SL ${g.sl}</text>` : ""}`).join("");
  let cum = 0; const cpts = months.map((g, i) => { cum += g.net; return [xs[i] + bw / 2, base - 20 - (cum / net) * 250]; });
  const labels = months.map((g, i) => `<text x="${xs[i] + bw / 2}" y="${base - hs[i] - 10}" text-anchor="middle" style="font:600 12px var(--font-head);fill:#f0d68c;paint-order:stroke;stroke:#120a0c;stroke-width:5px">${sg(g.net / 1000, 1)}k</text>`).join("");
  const arrow = `<path d="M${cpts.map((p) => p.join(" ")).join(" L")}" fill="none" stroke="url(#ar)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M${cpts.at(-1)[0] - 14} ${cpts.at(-1)[1] + 2} L${cpts.at(-1)[0] + 10} ${cpts.at(-1)[1] - 12} L${cpts.at(-1)[0] + 2} ${cpts.at(-1)[1] + 16} Z" fill="#c81a43"/>`;
  const chart = `<svg viewBox="0 0 ${Wd} ${Hd}"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#8f6a1c"/><stop offset=".3" stop-color="#f6e4a6"/><stop offset=".55" stop-color="#d2ab42"/><stop offset="1" stop-color="#8f6a1c"/></linearGradient>
    <linearGradient id="ar" x1="0" x2="1"><stop offset="0" stop-color="#7d0a22"/><stop offset=".6" stop-color="#e52150"/><stop offset="1" stop-color="#ff5a6b"/></linearGradient>
    <linearGradient id="cr" x1="0" x2="1"><stop offset="0" stop-color="#f6e4a6" stop-opacity=".0"/><stop offset=".5" stop-color="#dcb84a" stop-opacity=".35"/><stop offset="1" stop-color="#f6e4a6" stop-opacity=".0"/></linearGradient></defs>
    <path d="M30 ${base} A250 250 0 0 1 ${Wd - 30} ${base}" fill="none" stroke="url(#cr)" stroke-width="16"/>
    <line x1="10" x2="${Wd - 10}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.12)"/>${pillars}${arrow}${labels}
    <text x="${Wd - 16}" y="${cpts.at(-1)[1] - 18}" text-anchor="end" style="font:600 11px var(--font);fill:#ff8a9a">สะสม ${sg(net)}</text></svg>`;
  const beads = weeks.map((w) => { const s = 14 + (w.net / maxW) * 22; return `<span class="C-bead ${w.sl ? "sl" : ""} goldbar" style="width:${s}px;height:${s}px" title="${w.k}"></span>`; }).join("");
  html = `${title}
  <div class="C"><div>
