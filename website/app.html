<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="menu">
      <a class="logo" href="index.html"><img src="assets/img/mark.svg" alt="" width="40" height="40"><span class="logo__word">Order The Market<small data-i18n="brand.slogan">Your success is our mission</small></span></a>
      <div class="me" id="me"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__foot nav">
        <div class="nav__sep"></div>
        <a data-telegram href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/><path d="m9 13 8-6"/></svg><span data-i18n="app.contact">คุยกับทีมบน Telegram</span></a>

        <button class="topbar__menu" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-aria="nav.menu">

          <button class="btn btn--quiet lang-btn" type="button" data-lang-toggle data-i18n="lang.switch" data-i18n-aria="lang.label">EN</button>
        </div>
      </header>
      <main class="view" id="view">
        <div class="loading"><img src="assets/img/mark.svg" alt="" width="72" height="72"></div>
      </main>
    </div>
  </div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__box">
      <div class="modal__head"><h2 id="modal-title"></h2><button class="modal__x" type="button" data-close data-i18n-aria="app.close">×</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
