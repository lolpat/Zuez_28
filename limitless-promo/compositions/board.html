  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const shots = [{"t": 0, "x": 286.0, "y": 184.7, "scale": 1.2094}, {"t": 1.2, "x": 286.0, "y": -482.7, "scale": 1.2094}];
      const sel = "#board-cam";
      // Arrive slightly large and settle on the first framing.
      tl.fromTo(sel, { x: 164.3, y: 142.0, scale: 1.3545, transformOrigin: "0 0", filter: "blur(8px)" },

      // Fast moves to each next framing, with a blur peak mid-move.
      shots.slice(1).forEach((s) => {
        tl.to(sel, { x: s.x, y: s.y, scale: s.scale, duration: 0.45, ease: "power3.inOut" }, s.t);
        tl.to(sel, { filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, s.t);
        tl.to(sel, { filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, s.t + 0.2);
      });
      // Copy: kicker, then the line word by word.
      tl.fromTo("#board-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" }, 0.15);
      tl.fromTo(".board-word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out", stagger: 0.067 }, 0.3);

      window.__timelines["board"] = tl;
