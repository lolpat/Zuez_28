<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #intro-lockup {
      display: flex;
      align-items: center;
      gap: 56px;
    }
    #intro-mark {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 58px;
      background: linear-gradient(140deg, #6366f1 0%, #4338ca 100%);
      box-shadow: 0 30px 70px rgba(67, 56, 202, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .intro-bar {
      width: 16px;
      height: 92px;
      border-radius: 8px;
      background: #ffffff;
    }
    #intro-slash {
      position: absolute;
      left: 40px;
      top: 102px;
      width: 140px;
      height: 16px;
      border-radius: 8px;
      background: #ffffff;
    }
    #intro-word {
      display: flex;
      font-size: 200px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      color: #1d1d1f;
    }
  </style>
  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
    <div id="intro-lockup">
      <div id="intro-mark">
        <div class="intro-bar"></div>
        <div class="intro-bar"></div>
        <div class="intro-bar"></div>
        <div class="intro-bar"></div>
        <div id="intro-slash"></div>
      </div>
      <div id="intro-word">
        <span class="intro-letter">T</span><span class="intro-letter">a</span
        ><span class="intro-letter">l</span><span class="intro-letter">l</span
        ><span class="intro-letter">y</span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // The mark is already on screen at frame 0 and settles in.
      tl.fromTo(
        "#intro-mark",
        { scale: 0.82, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" },
        0,
      );

      // Four tally strokes draw up, then the slash crosses them: that's the logo.
      tl.fromTo(
        ".intro-bar",
        { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, duration: 0.3, ease: "power4.out", stagger: 0.08 },
        0.15,
      );
      tl.fromTo(
        "#intro-slash",
        { rotation: -28, scaleX: 0, transformOrigin: "0% 50%" },
        { rotation: -28, scaleX: 1, duration: 0.25, ease: "power3.out" },
        0.55,
      );

      // The name writes in letter by letter.
      tl.fromTo(
        ".intro-letter",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.1 },
        0.6,
      );

      // Exit: blur out and drop back before the first feature.
      tl.to(
        "#intro-lockup",
        { opacity: 0, scale: 0.94, filter: "blur(10px)", duration: 0.2, ease: "power3.in" },
        1.72,
      );

      window.__timelines["intro"] = tl;
    })();
  </script>
</template>
