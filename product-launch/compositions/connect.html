  <script>
    (() => {
      const ordersEl = document.getElementById("connect-orders");
      const orders = { value: 0 };
      const tl = gsap.timeline({ paused: true });

      // Title and app window arrive.
      tl.fromTo(
        "#connect-title",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#connect-window",
        { opacity: 0, y: 70, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" },
        0.05,
      );

      // The cursor comes in from the bottom right and lands on the button.
      tl.fromTo(
        "#connect-cursor",
        { x: 1980, y: 1120 },
        { x: 1395, y: 645, duration: 0.5, ease: "power3.out" },
        0.3,
      );

      // Click: press, then the button turns into "Connected" on the same frame.
      tl.to("#connect-btn", { scale: 0.95, duration: 0.08, ease: "power2.in" }, 0.75);
      tl.to("#connect-cursor", { scale: 0.9, duration: 0.08, ease: "power2.in", transformOrigin: "0% 0%" }, 0.75);
      tl.to("#connect-btn", { scale: 1, duration: 0.25, ease: "power3.out" }, 0.83);
      tl.to("#connect-cursor", { scale: 1, duration: 0.2, ease: "power3.out" }, 0.83);
      tl.fromTo("#connect-btn-done", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.83);
      tl.fromTo("#connect-btn-idle", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 0.83);

      // Orders start syncing.
      tl.fromTo("#connect-status", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.88);

        orders,
        { value: 0 },
        {
          value: 1284,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: () => {
            ordersEl.textContent = Math.round(orders.value).toLocaleString("en-US");
          },
        },
        0.88,
      );

      // Cursor leaves, then the scene blurs out.
      tl.to("#connect-cursor", { x: 1500, y: 1140, duration: 0.3, ease: "power3.in" }, 1.5);

        ["#connect-title", "#connect-window"],
