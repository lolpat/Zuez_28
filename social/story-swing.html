<!doctype html>
<!-- Instagram story (1080x1920) of the Swing Elite results. Copy into website/ and render over HTTP; numbers come from js/signals-data.js. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; background: #0b0a0b; color: #f4efe6; font-family: "IBM Plex Sans Thai", system-ui, sans-serif; overflow: hidden; }
.s { position: relative; width: 1080px; height: 1920px; padding: 210px 80px 240px; display: flex; flex-direction: column;
  background: radial-gradient(70% 38% at 50% 22%, rgba(109, 3, 23, .55), transparent 70%), radial-gradient(60% 30% at 80% 92%, rgba(229, 33, 80, .14), transparent 70%), #0b0a0b; }
.s::before { content: ""; position: absolute; inset: 34px; border-radius: 48px; border: 2px solid rgba(220, 184, 74, .28); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 22px; }
.brand img { width: 92px; height: 92px; }
.brand b { font: 600 34px "Kanit"; letter-spacing: .32em; }
.room { margin-top: 48px; display: flex; align-items: center; gap: 26px; }
.medal { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: #070607; border: 2px solid rgba(220, 184, 74, .35); }
.room h1 { font: 700 92px/1 "Kanit"; letter-spacing: .01em; }
.room p { margin-top: 10px; font-size: 32px; color: #b7aea2; }
.gold { background: linear-gradient(180deg, #f8e9b4 8%, #dcb84a 56%, #a8832c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero { margin-top: 44px; text-align: center; padding: 40px 30px 38px; border-radius: 40px; border: 2px solid rgba(229, 33, 80, .45);
  background: radial-gradient(120% 140% at 50% 0%, rgba(109, 3, 23, .55), transparent 70%), #141213; }
.hero small { display: block; font: 600 30px "Kanit"; letter-spacing: .28em; color: #ff7d9b; }
.hero b { display: block; font: 700 160px/1.05 "Kanit"; margin-top: 10px; }
.hero span { font-size: 30px; color: #b7aea2; }
.kpis { margin-top: 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpis div { text-align: center; padding: 30px 8px 26px; border-radius: 28px; background: #141213; border: 2px solid rgba(255, 255, 255, .06); }
.kpis b { display: block; font: 700 54px/1.1 "Kanit"; }
.kpis span { display: block; margin-top: 6px; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #b7aea2; }
.chart { margin-top: 26px; padding: 34px 40px 26px; border-radius: 36px; background: #141213; border: 2px solid rgba(255, 255, 255, .06); flex: 1; display: flex; flex-direction: column; }
.chart h2 { font: 600 30px "Kanit"; letter-spacing: .2em; text-transform: uppercase; color: #dcb84a; }
.bars { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 18px; align-items: end; margin-top: 26px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar em { font-style: normal; font-size: 24px; color: #d9d2c6; margin-bottom: 10px; }
.bar i { width: 100%; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, #b6ff5c, #7cfc00 45%, #4fae00); box-shadow: 0 0 30px rgba(124, 252, 0, .2); }
.bar span { margin-top: 14px; font-size: 24px; color: #b7aea2; }
.bar.part i { background: repeating-linear-gradient(135deg, #7cfc00 0 12px, #5bc400 12px 24px); }
.foot { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; font-size: 30px; }
.foot b { font-weight: 600; color: #f0d68c; }
.note { margin-top: 18px; font-size: 21px; line-height: 1.45; color: #8f877c; }
</style></head>
<body><div class="s">
  <div class="brand"><img src="assets/img/mark.svg" alt=""><b>ORDER THE MARKET</b></div>
  <div class="room">
    <div class="medal"><svg viewBox="0 0 40 46" width="70" height="80"><defs><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6e4a6"/><stop offset=".6" stop-color="#c89f3a"/><stop offset="1" stop-color="#6e4f12"/></radialGradient></defs><path d="M12 0h7l-3 14h-7zM28 0h-7l3 14h7z" fill="#e52150" opacity=".85"/><circle cx="20" cy="28" r="15" fill="url(#g)" stroke="#6e4f12"/><circle cx="20" cy="28" r="10.5" fill="none" stroke="#f6e4a6" stroke-opacity=".6"/><text x="20" y="33" text-anchor="middle" fill="#2a1a08" style="font:700 14px Kanit">1</text></svg></div>
    <div><h1>Swing Elite</h1><p id="range">Gold (XAUUSD)</p></div>
  </div>
  <div class="hero"><small>NET PIPS</small><b class="gold" id="net">+0</b><span id="sub"></span></div>
  <div class="kpis">
    <div><b id="days">0</b><span>Trading days</span></div>
    <div><b class="gold" id="green">0%</b><span>Profitable days</span></div>
    <div><b id="sl">0</b><span>Stop losses</span></div>
    <div><b class="gold" id="best">0</b><span>Best week</span></div>
  </div>
  <div class="chart"><h2>Pips by month</h2><div class="bars" id="bars"></div></div>
  <div class="foot"><span>Signals on Telegram</span><b>@zuez_28</b></div>
  <p class="note" id="note"></p>
</div>
<script src="js/signals-data.js"></script>
<script>
const D = window.OTM_SIGNALS, ds = D.rooms[0].days;
const n = (v) => Number(v).toLocaleString("en-US"), sg = (v) => (v >= 0 ? "+" : "−") + n(Math.abs(v));
const won = ds.reduce((s, d) => s + d[1], 0), lost = ds.reduce((s, d) => s + d[2], 0), sls = ds.reduce((s, d) => s + d[3], 0);
const mon = (iso) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const W = new Map(); ds.forEach((d) => W.set(mon(d[0]), (W.get(mon(d[0])) || 0) + d[1] - d[2]));
const M = new Map(); ds.forEach((d) => M.set(d[0].slice(0, 7), (M.get(d[0].slice(0, 7)) || 0) + d[1] - d[2]));
const fmt = (iso, y) => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}) });
const last = ds[ds.length - 1][0];
document.getElementById("range").textContent = `Gold (XAUUSD) · ${fmt(ds[0][0])} – ${fmt(last, true)}`;
document.getElementById("net").textContent = sg(won - lost);
document.getElementById("sub").textContent = `${sg(won)} won · ${sg(-lost)} lost · ${W.size} weeks`;
document.getElementById("days").textContent = ds.length;
document.getElementById("green").textContent = Math.round(ds.filter((d) => d[1] - d[2] > 0).length / ds.length * 100) + "%";
document.getElementById("sl").textContent = sls;
document.getElementById("best").textContent = sg(Math.max(...W.values()));
const max = Math.max(...M.values()), partial = new Date(last + "T12:00:00Z").getUTCDate() < 28;
document.getElementById("bars").innerHTML = [...M.entries()].map(([m, v], i, a) => {
  const p = partial && i === a.length - 1;
  return `<div class="bar${p ? " part" : ""}"><em>${sg(Math.round(v / 100) / 10).replace(/(\.\d)?$/, (x) => x)}k</em><i style="height:${(v / max * 82).toFixed(1)}%"></i><span>${new Date(m + "-15T12:00:00").toLocaleDateString("en-GB", { month: "short" })}${p ? "*" : ""}</span></div>`;
}).join("");
document.getElementById("note").textContent = `${partial ? "*" + new Date(last + "T12:00:00").toLocaleDateString("en-GB", { month: "short" }) + " to " + fmt(last) + ". " : ""}Pips as posted in the room, counted to the furthest target reached. Past results don't guarantee future results. Not financial advice.`;
</script></body></html>
