<!doctype html>
<!-- Instagram story (1080x1920) of a trade-by-trade signal room (?room=scalp|rr|hype). Copy into website/ and render over HTTP; numbers come from js/signals-data.js. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; background: #0b0a0b; color: #f4efe6; font-family: "IBM Plex Sans Thai", system-ui, sans-serif; overflow: hidden; }
.s { position: relative; width: 1080px; height: 1920px; padding: 210px 80px 240px; display: flex; flex-direction: column;
  background: radial-gradient(70% 38% at 50% 22%, rgba(109, 3, 23, .55), transparent 70%), radial-gradient(60% 30% at 80% 92%, rgba(229, 33, 80, .14), transparent 70%), #0b0a0b; }
.s::before { content: ""; position: absolute; inset: 34px; border-radius: 48px; border: 2px solid rgba(220, 184, 74, .28); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 22px; }
.brand img { width: 92px; height: 92px; }
.brand b { font: 600 34px "Kanit"; letter-spacing: .32em; }
.room { margin-top: 48px; display: flex; align-items: center; gap: 26px; }
.medal { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: #070607; border: 2px solid rgba(220, 184, 74, .35); }
.room h1 { font: 700 92px/1 "Kanit"; letter-spacing: .01em; }
.room p { margin-top: 10px; font-size: 32px; color: #b7aea2; }
.gold { background: linear-gradient(180deg, #f8e9b4 8%, #dcb84a 56%, #a8832c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero { margin-top: 44px; text-align: center; padding: 40px 30px 38px; border-radius: 40px; border: 2px solid rgba(229, 33, 80, .45);
  background: radial-gradient(120% 140% at 50% 0%, rgba(109, 3, 23, .55), transparent 70%), #141213; }
.hero small { display: block; font: 600 30px "Kanit"; letter-spacing: .28em; color: #ff7d9b; }
.hero b { display: block; font: 700 160px/1.05 "Kanit"; margin-top: 10px; }
.hero span { font-size: 30px; color: #b7aea2; }
.kpis { margin-top: 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpis div { text-align: center; padding: 30px 8px 26px; border-radius: 28px; background: #141213; border: 2px solid rgba(255, 255, 255, .06); }
.kpis b { display: block; font: 700 54px/1.1 "Kanit"; }
.kpis span { display: block; margin-top: 6px; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #b7aea2; }
.chart { margin-top: 26px; padding: 34px 40px 26px; border-radius: 36px; background: #141213; border: 2px solid rgba(255, 255, 255, .06); flex: 1; display: flex; flex-direction: column; }
.chart h2 { font: 600 30px "Kanit"; letter-spacing: .2em; text-transform: uppercase; color: #dcb84a; }
.bars { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 18px; align-items: end; margin-top: 26px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar em { font-style: normal; font-size: 24px; color: #d9d2c6; margin-bottom: 10px; }
.bar i { width: 100%; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, #b6ff5c, #7cfc00 45%, #4fae00); box-shadow: 0 0 30px rgba(124, 252, 0, .2); }
.bar span { margin-top: 14px; font-size: 24px; color: #b7aea2; }
.bar.part i { background: repeating-linear-gradient(135deg, #7cfc00 0 12px, #5bc400 12px 24px); }
.foot { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; font-size: 30px; }
.foot b { font-weight: 600; color: #f0d68c; }
.note { margin-top: 18px; font-size: 21px; line-height: 1.45; color: #8f877c; }
</style></head>
<body><div class="s">
  <div class="brand"><img src="assets/img/mark.svg" alt=""><b>ORDER THE MARKET</b></div>
  <div class="room">
    <div class="medal" id="medal"></div>
    <div><h1 id="name">Room</h1><p id="range">Gold (XAUUSD)</p></div>
  </div>
  <div class="hero"><small>NET PIPS</small><b class="gold" id="net">+0</b><span id="sub"></span></div>
  <div class="kpis">
    <div><b id="k1">0</b><span>Trades</span></div>
    <div><b class="gold" id="k2">0%</b><span>Win rate</span></div>
    <div><b id="k3">0</b><span>TP / SL</span></div>
    <div><b class="gold" id="k4">0</b><span>Profit factor</span></div>
  </div>
  <div class="chart"><h2 id="ctitle">Pips by month</h2><div class="bars" id="bars"></div></div>
  <div class="foot"><span>Signals on Telegram</span><b>@zuez_28</b></div>
  <p class="note" id="note"></p>
</div>
<script src="js/signals-data.js"></script>
<script>
const id = new URLSearchParams(location.search).get("room") || "rr";
const r = window.OTM_SIGNALS.rooms.find((x) => x.id === id), tr = r.trades.slice().sort((a, b) => a[0].localeCompare(b[0]));
const n = (v) => Number(v).toLocaleString("en-US"), sg = (v) => (v >= 0 ? "+" : "−") + n(Math.abs(Math.round(v)));
const k = (v) => Math.abs(v) >= 1000 ? (v < 0 ? "−" : "+") + (Math.abs(v) / 1000).toFixed(1) + "k" : (Math.round(v) === 0 ? "0" : sg(v));
const fmt = (iso, y) => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}) });
const wins = tr.filter((x) => x[3] > 0), losses = tr.filter((x) => x[3] < 0);
const gw = wins.reduce((s, x) => s + x[3], 0), gl = -losses.reduce((s, x) => s + x[3], 0);
const pal = { 2: ["#5c6069", "#b4b8c1", "#eef0f4"], 3: ["#5a2e14", "#b06a3b", "#f0b38a"] }[r.medal];
document.getElementById("medal").innerHTML = r.hype ? '<span style="font:800 30px Kanit;padding:6px 12px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#ff4fd8,#e52150 60%,#ff9a3d)">HYPE</span>'
  : `<svg viewBox="0 0 40 46" width="70" height="80"><defs><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${pal[2]}"/><stop offset=".6" stop-color="${pal[1]}"/><stop offset="1" stop-color="${pal[0]}"/></radialGradient></defs><path d="M12 0h7l-3 14h-7zM28 0h-7l3 14h7z" fill="#e52150" opacity=".85"/><circle cx="20" cy="28" r="15" fill="url(#g)" stroke="${pal[0]}"/><circle cx="20" cy="28" r="10.5" fill="none" stroke="${pal[2]}" stroke-opacity=".6"/><text x="20" y="33" text-anchor="middle" fill="#2a1a08" style="font:700 14px Kanit">${r.medal}</text></svg>`;
document.getElementById("name").textContent = r.name + (r.flash ? " ⚡" : "");
const first = tr[0][0], last = tr[tr.length - 1][0];
document.getElementById("range").textContent = `${r.source} · ${fmt(first)} – ${fmt(last, true)}`;
document.getElementById("net").textContent = sg(gw - gl);
document.getElementById("sub").textContent = `${sg(gw)} won · ${gl ? sg(-gl) : "0"} lost`;
document.getElementById("k1").textContent = tr.length;
document.getElementById("k2").textContent = Math.round(wins.length / tr.length * 100) + "%";
document.getElementById("k3").textContent = `${wins.length} / ${losses.length}`;
document.getElementById("k4").textContent = gl ? (gw / gl).toFixed(1) : "∞";
const spanDays = (new Date(last) - new Date(first)) / 864e5, daily = spanDays < 45;
const G = new Map(); tr.forEach((x) => { const key = daily ? x[0] : x[0].slice(0, 7); G.set(key, (G.get(key) || 0) + x[3]); });
document.getElementById("ctitle").textContent = daily ? "Pips by day" : "Pips by month";
const vals = [...G.values()], max = Math.max(1, ...vals.map(Math.abs));
document.getElementById("bars").innerHTML = [...G.entries()].map(([key, v]) => {
  const lbl = daily ? fmt(key) : new Date(key + "-15T12:00:00").toLocaleDateString("en-GB", { month: "short" });
  const neg = v < 0 ? ' style="background:linear-gradient(180deg,#ff8095,#e52150)"' : "";
  return `<div class="bar"><em>${k(v)}</em><i${neg ? neg.replace('"', `"height:${(Math.abs(v) / max * 82).toFixed(1)}%;`) : ` style="height:${(Math.abs(v) / max * 82).toFixed(1)}%"`}></i><span>${lbl}</span></div>`;
}).join("");
const left = [r.unresolved ? `${r.unresolved} signal${r.unresolved > 1 ? "s" : ""} with no result posted` : "", r.cancelled ? `${r.cancelled} cancelled` : ""].filter(Boolean).join(" and ");
document.getElementById("note").textContent = `Counts the ${tr.length} signals with a result posted in the room${left ? "; " + left + " are not counted" : ""}. Past results don't guarantee future results. Not financial advice.`;
</script></body></html>
